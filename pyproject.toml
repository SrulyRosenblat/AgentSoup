[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsoup"
version = "0.2.0"
description = "Mix prompts, models, and logic — cook up LLM-powered functions with ease."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Sruly Rosenblat", email = "SrulyRosenblat@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.95",
    "pydantic>=2",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/SrulyRosenblat/AgentSoup"

[tool.setuptools.packages.find]
where = ["src"]
